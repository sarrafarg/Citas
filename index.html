<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5b4bc4">
<title>Mis personas</title>
<style>
:root{
  --bg:#f5f4f0; --card:#fff; --ink:#1f2330; --mute:#6b7080; --line:#e6e4de;
  --acc:#5b4bc4; --acc-ink:#fff; --acc-soft:#ece9fb;
  --danger:#b42318; --danger-bg:#fdecea; --danger-line:#f3b9b3;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fff2cf;
  --ph-m:#e5484d; --ph-f:#3fa66b; --ph-o:#e0a100; --ph-l:#7b6ce0;
  --r:14px; --shadow:0 1px 2px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#131419; --card:#1d1f27; --ink:#eceef4; --mute:#9aa0b2; --line:#2c2f3a;
    --acc:#9186f2; --acc-ink:#12121a; --acc-soft:#2b2950;
    --danger:#ff8f86; --danger-bg:#3a1e1e; --danger-line:#6b2f2f;
    --ok:#5fd394; --ok-bg:#14301f; --warn:#f1c25a; --warn-bg:#382c0d;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
#app{max-width:760px;margin:0 auto;padding:0 16px}
h1{font-size:1.5rem;margin:0}
h2{font-size:.78rem;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 0 10px}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;color:var(--mute);font-size:.85rem}
.icon{background:none;border:0;font-size:1.25rem;padding:8px;border-radius:10px;line-height:1}
.icon:hover{background:var(--acc-soft)}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 2px;font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger-o{color:var(--danger);border-color:var(--danger-line);background:transparent}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.empty{color:var(--mute);font-size:.92rem;margin:6px 0}
.grid{display:grid;gap:12px}
@media(min-width:720px){.grid.two{grid-template-columns:1fr 1fr;align-items:start}.grid.two>.full{grid-column:1/-1}}

/* búsqueda y chips */
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.tag,.chip,.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:.84rem;background:var(--acc-soft);color:var(--ink);border:1px solid transparent;white-space:nowrap}
button.tag{cursor:pointer}
.tag.on,.pill.on{background:var(--acc);color:var(--acc-ink)}
.pill{background:var(--card);border-color:var(--line);cursor:pointer}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.pill.good{background:var(--ok-bg);color:var(--ok)}
.pill.neutral{background:var(--warn-bg);color:var(--warn)}
.chip button{background:none;border:0;padding:0 0 0 2px;font-size:1rem;line-height:1;color:var(--mute)}

/* lista de personas */
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.pcard:active{transform:scale(.99)}
.pmain{min-width:0;flex:1}
.pname{font-weight:700}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.pmeta{font-size:.84rem;color:var(--mute)}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background-size:cover;background-position:center;overflow:hidden}
.av.lg{width:68px;height:68px;font-size:1.5rem}
.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:1.8rem;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rem{border-color:var(--acc)}
.rem .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.rem .row:first-of-type{border-top:0}
.rem .when{color:var(--acc);font-weight:700;white-space:nowrap}

/* perfil */
.head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.head .sub{color:var(--mute);font-size:.88rem}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;padding:8px 12px;border-radius:99px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.tabs .n{font-size:.72rem;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 6px;margin-left:4px}
.tabs .n.red{background:var(--danger);color:#fff}
.alert{background:var(--danger-bg);border:2px solid var(--danger);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;color:var(--ink)}
.alert h3{margin:0 0 6px;color:var(--danger);font-size:1rem;letter-spacing:.03em}
.alert .g{margin:6px 0 0;font-size:.92rem}
.alert .g b{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--danger)}
.alert ul{margin:2px 0 0;padding-left:18px}
.alert.compact{margin:0 0 12px}
.irow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.irow:first-of-type{border-top:0}
.ilab{flex:none;width:9.5em;font-size:.86rem;color:var(--mute)}
@media(max-width:520px){.irow{flex-direction:column;gap:4px}.ilab{width:auto}}
.item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-of-type{border-top:0}
.item .body{flex:1;min-width:0}
.item .meta{font-size:.8rem;color:var(--mute)}
.item .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.item.used .txt{text-decoration:line-through;color:var(--mute)}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:.9rem;color:var(--acc-ink)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.sug{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sug .acts{display:flex;gap:6px;margin-top:8px}
.kind{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.inline{display:flex;gap:8px;margin-bottom:8px}
.inline input{flex:1;min-width:0}

/* formularios */
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin:0 0 12px;font-size:.85rem;color:var(--mute);font-weight:600}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.88rem;color:var(--ink);font-weight:500;background:var(--card)}
.opts input:checked+span{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.opts.rating input:checked+span.r-funciono{background:var(--ok);color:#fff}
.opts.rating input:checked+span.r-no{background:var(--danger);color:#fff}
.opts.rating input:checked+span.r-neutro{background:var(--warn);color:#fff}
.opts input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.ted{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;margin-top:4px}
.ted input{flex:1;min-width:8em;border:0;outline:0;background:none;padding:4px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}

/* modal */
dialog{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:20px 20px 0 0;max-height:92vh}
dialog::backdrop{background:rgba(10,10,20,.5)}
@media(min-width:600px){dialog{margin:auto;border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
.sheet header h2{font-size:1.05rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.sbody{padding:8px 16px;max-height:calc(92vh - 130px);overflow:auto}
.sheet footer{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:center}
.sheet footer .sp{flex:1}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;font-size:.92rem}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ciclo */
.phase{display:flex;gap:12px;align-items:center}
.phase .big{font-size:1.9rem}
.phase b{font-size:1.1rem}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:.72rem;color:var(--mute);padding:2px 0}
.cd{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;font-size:.9rem;padding:0;display:grid;place-items:center}
.cd.blank{visibility:hidden}
.cd.ph-menstrual{background:color-mix(in srgb,var(--ph-m) 45%,transparent)}
.cd.ph-folicular{background:color-mix(in srgb,var(--ph-f) 18%,transparent)}
.cd.ph-ovulacion{background:color-mix(in srgb,var(--ph-o) 38%,transparent)}
.cd.ph-lutea{background:color-mix(in srgb,var(--ph-l) 18%,transparent)}
.cd.pms{background:color-mix(in srgb,var(--ph-l) 34%,transparent)}
.cd.pred{border:1px dashed color-mix(in srgb,var(--mute) 55%,transparent)}
.cd.today{outline:2px solid var(--acc);outline-offset:-1px;font-weight:800}
.cd .mk{position:absolute;top:2px;right:4px;font-size:.55rem;color:var(--ph-m)}
.cd .mk2{position:absolute;bottom:1px;right:4px;font-size:.6rem;color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tips{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.note-sm{font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<script>
'use strict';
/* =====================================================================
   Mis personas — CRM personal (un solo archivo, datos en localStorage)
   ===================================================================== */
const KEY = 'crm-personal-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');

/* ---------- fechas (todo en ISO local YYYY-MM-DD) ---------- */
const parseD = iso => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const addDays = (iso, n) => { const d = parseD(iso); d.setDate(d.getDate() + n); return toISO(d); };
const fmtD = (iso, o = { day: 'numeric', month: 'short', year: 'numeric' }) => parseD(iso).toLocaleDateString('es-AR', o);
const fmtShort = iso => fmtD(iso, { day: 'numeric', month: 'short' });
const daysLabel = n => n === 0 ? 'hoy' : n === 1 ? 'mañana' : `en ${n} días`;
const agoLabel = iso => {
  const n = daysBetween(iso.slice(0, 10), todayISO());
  return n <= 0 ? 'hoy' : n === 1 ? 'ayer' : n < 30 ? `hace ${n} días` : fmtD(iso.slice(0, 10));
};
const fmtTime = iso => new Date(iso).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
const localDay = iso => toISO(new Date(iso)); // ISO datetime (UTC) -> día local

/* ---------- categorías de intereses ---------- */
const DEFAULT_CATS = [
  { key: 'musica', label: 'Música', icon: '🎵', hint: 'Banda o artista' },
  { key: 'comida', label: 'Comida favorita', icon: '🍜', hint: 'Ej: sushi, helado de pistacho' },
  { key: 'perfume', label: 'Perfume', icon: '🌸', hint: 'Ej: Coco Mademoiselle' },
  { key: 'hobbies', label: 'Hobbies', icon: '🎨', hint: 'Ej: yoga, fotografía' },
  { key: 'trabajo', label: 'Trabajo y horario', icon: '💼', hint: 'Ej: diseñadora, turno 9 a 18' },
  { key: 'estudia', label: 'Estudia', icon: '📚', hint: 'Ej: Psicología, 3er año' },
  { key: 'otros', label: 'Otros intereses', icon: '✨', hint: 'Cualquier otro tag' },
];
const EVITAR = { key: 'evitar', label: 'Evitar', icon: '⚠️' };
const catOf = key => key === 'evitar' ? EVITAR : S.cats.find(c => c.key === key) || { key, label: key, icon: '🏷️', hint: 'Tag' };

/* ---------- estado y persistencia ---------- */
const newPerson = name => ({
  id: uid(), name, photo: '', metHow: '', metDate: todayISO(), addedAt: new Date().toISOString(),
  interests: {}, notes: [], dates: [], ideas: [], outings: [], avoid: [], dismissed: [],
  cycle: { on: false, cycleLength: 28, periodLength: 5, starts: [] },
});
function migrate(r) {
  r.cats = Array.isArray(r.cats) && r.cats.length ? r.cats : DEFAULT_CATS.map(c => ({ ...c }));
  r.people.forEach(p => {
    const b = newPerson(p.name);
    Object.keys(b).forEach(k => { if (p[k] === undefined) p[k] = b[k]; });
    p.cycle = { ...b.cycle, ...p.cycle };
  });
  return r;
}
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.people)) return migrate(r);
  } catch (e) { /* almacenamiento vacío o corrupto */ }
  return { v: 1, cats: DEFAULT_CATS.map(c => ({ ...c })), people: [] };
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar (almacenamiento lleno). Exportá un respaldo.'); }
}
try { navigator.storage?.persist?.(); } catch (e) { /* opcional */ }
const byId = id => S.people.find(p => p.id === id);
const ui = { q: '', tag: '', tab: {}, noteFilter: '', noteLimit: 15, ideaFilter: 'all', cal: null, extra: {} };

/* ---------- derivados de la persona ---------- */
const allTags = p => S.cats.flatMap(c => (p.interests[c.key] || []).map(t => ({ cat: c.key, text: t })));

function nextOcc(d, from = todayISO()) {
  if (!d.date) return null;
  if (d.recurring) {
    const [y0, m, dd] = d.date.split('-').map(Number), fy = +from.slice(0, 4);
    let c = toISO(new Date(fy, m - 1, dd));
    if (c < from) c = toISO(new Date(fy + 1, m - 1, dd));
    return { iso: c, days: daysBetween(from, c), years: +c.slice(0, 4) - y0 };
  }
  const days = daysBetween(from, d.date);
  return { iso: d.date, days, past: days < 0, years: 0 };
}
const DATE_TYPES = { cumple: ['🎂', 'Cumpleaños'], aniversario: ['💞', 'Aniversario'], evento: ['📌', 'Evento'], otro: ['⭐', 'Otra'] };
function nextDate(p) {
  return p.dates.map(d => ({ d, o: nextOcc(d) })).filter(x => x.o && !x.o.past).sort((a, b) => a.o.days - b.o.days)[0] || null;
}
function reminders() {
  const out = [];
  S.people.forEach(p => p.dates.forEach(d => {
    const o = nextOcc(d);
    if (o && !o.past && o.days <= (d.remind ?? 7)) out.push({ p, d, o });
  }));
  return out.sort((a, b) => a.o.days - b.o.days);
}

/* ---------- alerta "NO HAGAS ESTO" ---------- */
function alertItems(p) {
  const items = [];
  p.avoid.forEach(a => items.push({ type: 'evitar', text: a.text }));
  p.outings.filter(o => o.rating === 'no').forEach(o => items.push({ type: 'salida', text: o.what, how: o.how, date: o.date }));
  p.notes.filter(n => n.tags.includes('evitar')).forEach(n => items.push({ type: 'nota', text: n.text, date: localDay(n.date) }));
  return items;
}
function alertHTML(p, compact) {
  const items = alertItems(p);
  if (!items.length) return '';
  const groups = [
    ['evitar', 'Cosas a evitar', i => esc(i.text)],
    ['salida', 'Salidas que no funcionaron', i => `${esc(i.text)} <span class="note-sm">(${fmtShort(i.date)})</span>${i.how ? ' — ' + esc(i.how) : ''}`],
    ['nota', 'Notas marcadas para evitar', i => `${esc(i.text.length > 110 ? i.text.slice(0, 110) + '…' : i.text)} <span class="note-sm">(${fmtShort(i.date)})</span>`],
  ];
  const cap = compact ? 3 : 4;
  const html = groups.map(([t, label, fn]) => {
    const list = items.filter(i => i.type === t);
    if (!list.length) return '';
    const more = list.length - cap;
    return `<div class="g"><b>${label}</b><ul>${list.slice(0, cap).map(i => `<li>${fn(i)}</li>`).join('')}</ul>${more > 0 && !compact ? `<button class="link" data-a="tab" data-tab="evitar">+${more} más</button>` : ''}</div>`;
  }).join('');
  return `<section class="alert${compact ? ' compact' : ''}" role="alert"><h3>⚠️ NO HAGAS ESTO</h3>${html}</section>`;
}
function similarWarn(p, text) {
  const w = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/[^a-z0-9]+/).filter(x => x.length >= 4);
  const words = new Set(w(text));
  if (!words.size) return [];
  return alertItems(p).filter(i => w(i.text + ' ' + (i.how || '')).some(x => words.has(x)));
}

/* ---------- calendario menstrual ---------- */
const PHASES = {
  menstrual: { label: 'Menstrual', icon: '🩸', color: 'var(--ph-m)', desc: 'Está en su período. Puede haber cansancio, dolor o menos energía.', tips: ['Plan tranquilo, preferentemente en casa', 'Preguntarle qué necesita en vez de asumir', 'Detalles útiles: infusión, bolsa de calor, algo rico'] },
  folicular: { label: 'Folicular', icon: '🌱', color: 'var(--ph-f)', desc: 'Suele subir la energía y el ánimo.', tips: ['Buen momento para planes activos o algo nuevo', 'Salidas más largas o sociales'] },
  ovulacion: { label: 'Ovulatoria', icon: '☀️', color: 'var(--ph-o)', desc: 'Ventana fértil (aprox.). Suele haber pico de energía y sociabilidad.', tips: ['Buen momento para una cita especial', 'Si es relevante: es su ventana fértil'] },
  lutea: { label: 'Lútea', icon: '🌙', color: 'var(--ph-l)', desc: 'La energía va bajando; en los últimos días puede aparecer el síndrome premenstrual.', tips: ['Planes livianos, sin presión', 'Paciencia y detalles chicos', 'Evitar temas cargados o discusiones largas'] },
};
function cycAvg(c) {
  const s = [...c.starts].sort(), d = [];
  for (let i = 1; i < s.length; i++) { const n = daysBetween(s[i - 1], s[i]); if (n >= 18 && n <= 60) d.push(n); }
  const last = d.slice(-6);
  return { L: last.length ? Math.round(last.reduce((a, b) => a + b, 0) / last.length) : (c.cycleLength || 28), measured: last.length };
}
function cycleInfo(p, iso) {
  const c = p.cycle;
  if (!c.on) return null;
  const starts = [...c.starts].sort(), { L } = cycAvg(c), per = c.periodLength || 5;
  let base = null;
  for (const s of starts) if (s <= iso) base = s;
  if (!base) return null;
  const isLast = base === starts[starts.length - 1];
  let day = daysBetween(base, iso) + 1, predicted = false;
  if (day > L) { if (isLast) { predicted = true; day = ((day - 1) % L) + 1; } else day = L; }
  const ov = Math.max(per + 3, L - 14);
  const phase = day <= per ? 'menstrual' : day < ov - 1 ? 'folicular' : day <= ov + 1 ? 'ovulacion' : 'lutea';
  return { day, phase, L, per, ov, predicted, pms: phase === 'lutea' && day > L - 5 };
}
function nextPeriod(p) {
  const c = p.cycle, starts = [...c.starts].sort();
  if (!starts.length) return null;
  const { L } = cycAvg(c), t = todayISO();
  let cand = addDays(starts[starts.length - 1], L), late = 0;
  while (cand < t) { late = daysBetween(cand, t); cand = addDays(cand, L); }
  return { iso: cand, days: daysBetween(t, cand), late };
}

/* ---------- motor de sugerencias ----------
   Estructura: cada proveedor tiene { id, async?, suggest(person) } y devuelve
   [{ key, kind: 'regalo'|'plan'|'gesto', text, why, score, tag? }].
   Hoy hay un proveedor de reglas (matching de tags). Para sumar IA:
     Suggest.providers.push({ id: 'ia', async: true, suggest: async person => [...] });
   y llamar Suggest.refreshAsync(person) (los resultados se mezclan solos). */
const CAT_RULES = {
  musica: [['plan', 'Buscar entradas para un show de {t}'], ['regalo', 'Merch o vinilo de {t}'], ['gesto', 'Armar una playlist con temas de {t} y escucharla juntos']],
  comida: [['plan', 'Reservar en un lugar especializado en {t}'], ['plan', 'Cocinar {t} juntos en casa'], ['gesto', 'Llevarle {t} de sorpresa']],
  perfume: [['regalo', 'Regalarle {t} (o un decant/miniatura de uno parecido para probar)']],
  hobbies: [['plan', 'Plan ligado a {t}: una clase, taller o salida temática'], ['regalo', 'Un regalo que sume a su hobby: {t}']],
  trabajo: [['plan', 'Proponer un plan que respete su rutina ({t})'], ['gesto', 'Mandarle un mensaje de ánimo antes de su jornada ({t})']],
  estudia: [['regalo', 'Algo útil para su cursada ({t}): libreta, snacks o un cargador portátil'], ['plan', 'Acompañarla en una tarde de estudio y salir a cenar después ({t})']],
  _default: [['plan', 'Plan relacionado con {t}'], ['regalo', 'Regalo relacionado con {t}']],
};
const KW_RULES = [
  ['cafe', /caf[eé]/i, 'plan', 'Ir a una cafetería de especialidad ({t})'],
  ['cine', /cine|pel[ií]cula|serie|netflix/i, 'plan', 'Ir al cine a ver un estreno o hacer maratón de series ({t})'],
  ['libro', /libro|lectura|leer|novela/i, 'regalo', 'Regalarle un libro de su género o autor favorito ({t})'],
  ['viaje', /viaj|playa|monta[nñ]a|trekking|camping/i, 'plan', 'Escapada corta de fin de semana ({t})'],
  ['fit', /gym|yoga|running|correr|fitness|pilates|nataci/i, 'plan', 'Clase de prueba o salida activa juntos ({t})'],
  ['foto', /foto|c[aá]mara/i, 'regalo', 'Un rollo/álbum o accesorio de fotografía ({t})'],
  ['bebida', /vino|cerveza|birra|fernet|\bgin\b/i, 'plan', 'Cata o salida a un bar especializado ({t})'],
  ['mascota', /gato|perro|mascota|animal/i, 'regalo', 'Un detalle para su mascota o de temática animal ({t})'],
  ['gamer', /videojuego|gaming|playstation|switch|steam|gamer/i, 'plan', 'Tarde de videojuegos o juego nuevo ({t})'],
  ['arte', /\barte\b|museo|dibuj|pintur|teatro/i, 'plan', 'Museo, muestra u obra de teatro ({t})'],
  ['cocina', /cocin|reposter|pastel|torta/i, 'plan', 'Cocinar o hornear algo juntos ({t})'],
];
const CYCLE_SUG = {
  menstrual: [['gesto', 'Escribirle para preguntar cómo está y qué necesita hoy'], ['regalo', 'Detalle reconfortante: chocolate, infusión o bolsa de calor'], ['plan', 'Plan tranquilo en casa: peli y comida rica']],
  folicular: [['plan', 'Aprovechar la energía: plan activo o algo que no hayan probado']],
  ovulacion: [['plan', 'Cita especial o salida social']],
  lutea: [['gesto', 'Tener paciencia y un detalle chico para el día a día'], ['plan', 'Plan liviano y sin presión']],
};
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const excerpt = s => { const w = s.trim().split(/\s+/); return w.slice(0, 8).join(' ') + (w.length > 8 ? '…' : ''); };

const RulesProvider = {
  id: 'reglas',
  suggest(p) {
    const out = new Map();
    const add = (key, kind, text, why, score, tag) => {
      const cur = out.get(key);
      if (!cur || cur.score < score) out.set(key, { key, kind, text, why, score, tag: tag || key, src: 'reglas' });
    };
    const notes = p.notes.filter(n => !n.tags.includes('evitar'));
    const mention = t => notes.find(n => norm(n.text).includes(norm(t)));

    S.cats.forEach(c => (p.interests[c.key] || []).forEach(t => {
      const m = mention(t), base = m ? 3 : 1;
      const why = m ? `${c.label}: “${t}” — mencionado también en una nota del ${fmtShort(localDay(m.date))}` : `${c.label}: ${t}`;
      (CAT_RULES[c.key] || CAT_RULES._default).forEach(([kind, tpl], i) =>
        add(`${c.key}:${i}:${norm(t)}`, kind, tpl.replace('{t}', t), why, base, norm(t)));
      KW_RULES.forEach(([id, re, kind, tpl]) => re.test(`${c.label} ${t}`) && add(`kw:${id}:${norm(t)}`, kind, tpl.replace('{t}', t), why, base + .5, norm(t)));
    }));

    // notas con tags de categoría: alimentan las sugerencias aunque el interés no esté cargado
    const tags = allTags(p).map(t => norm(t.text));
    notes.filter(n => n.tags.length).slice(0, 5).forEach(n => {
      const why = `Nota (${catOf(n.tags[0]).label}) del ${fmtShort(localDay(n.date))}`;
      KW_RULES.forEach(([id, re, kind, tpl]) => re.test(n.text) && add(`kwn:${id}:${n.id}`, kind, tpl.replace('{t}', excerpt(n.text)), why, 2, 'n' + n.id));
      if (!tags.some(t => norm(n.text).includes(t)))
        add(`note:${n.id}`, 'plan', `Plan o regalo inspirado en tu nota: “${excerpt(n.text)}”`, why, 2, 'n' + n.id);
    });

    // fechas cercanas sin regalo/gesto definido
    p.dates.forEach(d => {
      const o = nextOcc(d);
      if (o && !o.past && o.days <= 30 && !d.gift)
        add(`date:${d.id}`, 'regalo', `Definir un regalo o gesto para “${d.title}” (${daysLabel(o.days)})`, 'Fecha importante sin idea asignada', 5, 'd' + d.id);
    });

    // momento del ciclo
    const ci = cycleInfo(p, todayISO());
    if (ci) (CYCLE_SUG[ci.phase] || []).forEach(([kind, text], i) =>
      add(`cyc:${ci.phase}:${i}`, kind, text, `Hoy: fase ${PHASES[ci.phase].label.toLowerCase()} (día ${ci.day})`, 1.5, 'cyc' + i));

    // descartar lo que choca con "cosas a evitar" o con salidas que no funcionaron
    const avoids = p.avoid.map(a => norm(a.text)).filter(a => a.length >= 3);
    const failed = p.outings.filter(o => o.rating === 'no').map(o => norm(o.what));
    return [...out.values()].filter(s => {
      const t = norm(s.text);
      return !avoids.some(a => t.includes(a) || (s.tag.length > 2 && a.includes(s.tag))) && !failed.some(f => f.length > 3 && s.tag.length > 2 && f.includes(s.tag));
    });
  },
};
const Suggest = {
  providers: [RulesProvider],
  forPerson(p, limit = 99) {
    const saved = new Set(p.ideas.map(i => norm(i.text)));
    let list = [...this.providers.filter(x => !x.async).flatMap(x => x.suggest(p)), ...(ui.extra[p.id] || [])]
      .filter(s => !p.dismissed.includes(s.key) && !saved.has(norm(s.text)))
      .sort((a, b) => b.score - a.score);
    // diversidad: máximo 2 por tag en la primera pasada, el resto después
    const seen = {}, first = [], rest = [];
    list.forEach(s => ((seen[s.tag] = (seen[s.tag] || 0) + 1) <= 2 ? first : rest).push(s));
    return [...first, ...rest].slice(0, limit);
  },
  async refreshAsync(p) {
    const res = await Promise.all(this.providers.filter(x => x.async).map(x => x.suggest(p).catch(() => [])));
    ui.extra[p.id] = res.flat();
    render();
  },
};

/* ---------- ciclo ---------- */
function tCiclo(p) {
  const c = p.cycle;
  if (!c.on) return `<section class="card"><h2>Calendario menstrual</h2><p>Activalo solo si te sirve para esta persona. Con la fecha de inicio de cada período, la app estima en qué fase está y cuándo viene el próximo.</p>
    <button class="btn primary" data-a="cycle-on">Activar para ${esc(p.name)}</button></section>`;
  const t = todayISO(), ci = cycleInfo(p, t), np = nextPeriod(p), { L, measured } = cycAvg(c), starts = [...c.starts].sort();
  if (!ui.cal) ui.cal = t.slice(0, 7);
  const [Y, M] = ui.cal.split('-').map(Number), first = new Date(Y, M - 1, 1), dim = new Date(Y, M, 0).getDate();
  const dateSet = new Set(p.dates.map(d => nextOccOn(d, Y)).filter(Boolean));
  let cells = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(w => `<div class="wd">${w}</div>`).join('') + '<div class="cd blank"></div>'.repeat((first.getDay() + 6) % 7);
  for (let d = 1; d <= dim; d++) {
    const iso = `${Y}-${pad(M)}-${pad(d)}`, i = cycleInfo(p, iso);
    cells += `<button class="cd${i ? ' ph-' + i.phase : ''}${i?.pms ? ' pms' : ''}${i?.predicted ? ' pred' : ''}${iso === t ? ' today' : ''}" data-a="cal-day" data-d="${iso}" aria-label="${fmtD(iso)}${i ? ', ' + PHASES[i.phase].label : ''}">${d}${starts.includes(iso) ? '<i class="mk">●</i>' : ''}${dateSet.has(iso) ? '<i class="mk2">★</i>' : ''}</button>`;
  }
  const ph = ci && PHASES[ci.phase];
  return `${ci ? `<section class="card"><div class="phase"><span class="big">${ph.icon}</span><div><b>Fase ${ph.label.toLowerCase()}</b> · día ${ci.day} del ciclo${ci.pms ? ' · posible SPM' : ''}
      <div class="note-sm">${np ? `Próximo período ${np.days === 0 ? 'hoy' : daysLabel(np.days)} (${fmtD(np.iso, { weekday: 'short', day: 'numeric', month: 'short' })})` : ''}</div></div></div>
      <p style="margin-top:10px">${ph.desc}</p><ul class="tips">${ph.tips.map(x => `<li>${x}</li>`).join('')}</ul>
      ${ci.predicted && np?.late > 0 ? `<div class="warnbox" style="margin:10px 0 0">Se esperaba el inicio hace ${np.late} día${np.late > 1 ? 's' : ''}. Si ya empezó, registralo para ajustar el calendario.</div>` : ''}</section>`
      : `<section class="card"><p><b>Falta un dato para empezar.</b></p><p class="empty">Registrá el primer día del último período.</p></section>`}
  <div class="bar"><button class="btn primary" data-a="cycle-today">Hoy empezó su período</button><button class="btn" data-a="cycle-add">Otra fecha…</button></div>
  <section class="card"><div class="cal-h"><button class="icon" data-a="cal-prev" aria-label="Mes anterior">‹</button><b>${first.toLocaleDateString('es-AR', { month: 'long' }).replace(/^./, c => c.toUpperCase())} ${Y}</b><button class="icon" data-a="cal-next" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:color-mix(in srgb,var(--ph-m) 45%,transparent)"></i>Período</span><span><i style="background:color-mix(in srgb,var(--ph-f) 18%,transparent)"></i>Folicular</span><span><i style="background:color-mix(in srgb,var(--ph-o) 38%,transparent)"></i>Ovulatoria</span><span><i style="background:color-mix(in srgb,var(--ph-l) 24%,transparent)"></i>Lútea</span><span>● inicio registrado</span><span>★ fecha importante</span><span>┄ estimado</span></div>
    <p class="note-sm">Tocá un día para marcar o quitar un inicio. Son estimaciones según el promedio (${measured ? `${measured} ciclo${measured > 1 ? 's' : ''} registrado${measured > 1 ? 's' : ''}` : 'configurado'}: ${L} días); no reemplaza consejo médico ni sirve como método anticonceptivo.</p></section>
  <section class="card"><div class="ch"><h2>Historial de inicios</h2><button class="link" data-a="cycle-cfg">Ajustes</button></div>
    ${starts.length ? [...starts].reverse().map((s, i, arr) => { const prev = arr[i + 1]; return `<div class="item"><div class="body">${fmtD(s, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })}${prev ? `<span class="meta"> · ciclo de ${daysBetween(prev, s)} días</span>` : ''}</div><button class="icon" data-a="cycle-del" data-d="${s}" aria-label="Quitar">✕</button></div>`; }).join('') : '<p class="empty">Sin registros.</p>'}</section>`;
}
const nextOccOn = (d, year) => { // ocurrencia de la fecha en un año dado (para marcar en el calendario)
  if (!d.date) return null;
  const [y, m, dd] = d.date.split('-').map(Number);
  return d.recurring ? `${year}-${pad(m)}-${pad(dd)}` : d.date;
};

const chipX = t => `<span class="chip" data-tag="${esc(t)}">${esc(t)}<button type="button" data-a="rm-chip" aria-label="Quitar ${esc(t)}">×</button></span>`;
const tagEd = (name, tags, hint) => `<div class="ted" data-name="${esc(name)}">${tags.map(chipX).join('')}<input class="tin" placeholder="${esc(hint)}" enterkeyhint="done" autocomplete="off"></div>`;
function commitTag(input) {
  const v = input.value.replace(/,/g, '').trim();
  input.value = '';
  if (!v) return;
  const ed = input.closest('.ted');
  if ([...ed.querySelectorAll('.chip')].some(c => norm(c.dataset.tag) === norm(v))) return;
  input.insertAdjacentHTML('beforebegin', chipX(v));
}

function resizePhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = 240, c = document.createElement('canvas'); c.width = c.height = s;
      const m = Math.min(img.width, img.height), ctx = c.getContext('2d');
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .78));
    };
    img.onerror = rej; img.src = url;
  });
}

    title: 'Respaldo y ajustes',
    body: `<p>Tus datos se guardan <b>solo en este navegador</b> (${S.people.length} persona${S.people.length === 1 ? '' : 's'}, ~${kb} KB). No hay servidor ni cuenta.</p>
      <p class="note-sm">Para pasar los datos entre el celular y la compu, o para no perderlos si borrás los datos del navegador, exportá un respaldo e importalo en el otro dispositivo.</p>
      <div class="bar"><button type="button" class="btn primary" data-a="export">⬇️ Exportar respaldo</button><button type="button" class="btn" data-a="import">⬆️ Importar respaldo</button></div>
      <div class="bar"><button type="button" class="btn sm ghost" data-a="demo">Cargar ejemplo</button><button type="button" class="btn sm danger-o" data-a="wipe">Borrar todo</button></div>`,
  });
}

/* ejemplo */
function demoData() {
  const t = todayISO(), ago = n => new Date(Date.now() - n * 864e5).toISOString();
  const p = newPerson('Sofi');
  p.metHow = 'En el cumple de Caro'; p.metDate = addDays(t, -140);
  p.interests = {
    musica: ['Arctic Monkeys', 'Cazzu'], comida: ['Sushi', 'Helado de pistacho'], perfume: ['Coco Mademoiselle'],
    hobbies: ['Yoga', 'Fotografía analógica'], trabajo: ['Diseñadora UX', 'Trabaja de 9 a 18'],
    estudia: ['Psicología (3er año)'], otros: ['Café de especialidad', 'Gatos'],
  };
  p.notes = [
    { id: uid(), date: ago(2), text: 'Me contó que quiere ir a ver a Arctic Monkeys si vuelven a Argentina.', tags: ['musica'] },
    { id: uid(), date: ago(9), text: 'Le encanta el ramen picante, quiere probar el lugar nuevo de Palermo.', tags: ['comida'] },
    { id: uid(), date: ago(20), text: 'No le gusta que le hablen de su ex ni de su viejo trabajo.', tags: ['evitar'] },
    { id: uid(), date: ago(35), text: 'Sale del laburo a las 18 pero los jueves se queda hasta tarde.', tags: ['trabajo'] },
  ];
  const bd = parseD(addDays(t, 12)); bd.setFullYear(bd.getFullYear() - 26);
  p.dates = [
    { id: uid(), title: 'Cumpleaños', type: 'cumple', date: toISO(bd), recurring: true, remind: 14, gift: 'Entradas o algo de fotografía analógica' },
    { id: uid(), title: 'Aniversario primera salida', type: 'aniversario', date: addDays(t, -120), recurring: true, remind: 5, gift: '' },
    { id: uid(), title: 'Final de Psicología', type: 'evento', date: addDays(t, 20), recurring: false, remind: 3, gift: 'Escribirle antes del examen' },
  ];
  p.outings = [
    { id: uid(), date: addDays(t, -100), what: 'Cena en el japonés de Palermo', how: 'Muy buena onda, charlaron horas', rating: 'funciono' },
    { id: uid(), date: addDays(t, -60), what: 'Cine: película de terror', how: 'Se aburrió y quedó incómoda', rating: 'no' },
    { id: uid(), date: addDays(t, -25), what: 'Café y paseo por el parque', how: '', rating: 'neutro' },
  ];
  p.avoid = [{ id: uid(), text: 'Llegar tarde' }];
  p.ideas = [{ id: uid(), kind: 'plan', text: 'Picnic con fotos analógicas', used: false }];
  p.cycle = { on: true, cycleLength: 28, periodLength: 5, starts: [addDays(t, -75), addDays(t, -47), addDays(t, -19)] };
  S.people.push(p); save();
}

/* =====================================================================
   ACCIONES
   ===================================================================== */
const cur = () => byId(location.hash.split('/')[2]);
const H = {
  'menu': () => menuModal(),
  'close-modal': closeModal,
  'modal-danger': () => modalDanger?.(),
  'add-person': () => personModal(),
  'edit-person': () => personModal(cur()),
  'pick-photo': () => $('#photoFile').click(),
  'rm-photo': () => { pendingPhoto = ''; $('#phprev').innerHTML = photoPrev($('#mf [name=name]').value || '?', ''); },
  'open': el => { ui.tab[el.dataset.id] = el.dataset.tab || 'resumen'; location.hash = `#/p/${el.dataset.id}`; },
  'tab': el => { const p = cur(); ui.tab[p.id] = el.dataset.tab; ui.noteFilter = ''; render(); window.scrollTo({ top: 0 }); },
  'filter-tag': el => { ui.tag = norm(el.dataset.t); ui.q = ''; if (location.hash !== '#/') location.hash = '#/'; else render(); },
  'clear-tag': () => { ui.tag = ''; render(); },
  'edit-interests': () => interestsModal(cur()),
  'rm-chip': el => el.closest('.chip').remove(),
  'add-cat': () => {
    const inp = $('#newcat'), name = inp.value.trim();
    if (!name) return;
    let key = 'c_' + norm(name).replace(/[^a-z0-9]+/g, '_');
    if (S.cats.some(c => c.key === key)) { toast('Esa categoría ya existe'); return; }
    const c = { key, label: name, icon: '🏷️', hint: 'Escribí y Enter' };
    S.cats.push(c); save(); inp.value = '';
    $('#cats').insertAdjacentHTML('beforeend', catSection(c, []));
  },
  'del-cat': el => {
    const k = el.dataset.k;
    if (!confirm('¿Quitar esta categoría y sus tags de todas las personas?')) return;
    S.cats = S.cats.filter(c => c.key !== k); S.people.forEach(p => { delete p.interests[k]; p.notes.forEach(n => { n.tags = n.tags.filter(x => x !== k); }); });
    save(); el.closest('[data-cat]').remove();
  },
  'add-note': () => noteModal(cur()),
  'edit-note': el => noteModal(cur(), cur().notes.find(n => n.id === el.dataset.id)),
  'note-filter': el => { ui.noteFilter = el.dataset.t; render(); },
  'more-notes': () => { ui.noteLimit += 15; render(); },
  'add-date': () => dateModal(cur()),
  'edit-date': el => dateModal(cur(), cur().dates.find(d => d.id === el.dataset.id)),
  'add-idea': () => ideaModal(cur()),
  'edit-idea': el => ideaModal(cur(), cur().ideas.find(i => i.id === el.dataset.id)),
  'toggle-idea': el => { const i = cur().ideas.find(x => x.id === el.dataset.id); i.used = !i.used; save(); render(); },
  'idea-filter': el => { ui.ideaFilter = el.dataset.f; render(); },
  'save-sug': el => {
    const p = cur(), s = Suggest.forPerson(p).find(x => x.key === el.dataset.k);
    if (!s) return;
    p.ideas.push({ id: uid(), kind: s.kind, text: s.text, used: false, from: 'sugerida' });
    save(); render(); toast('Guardada en el banco de ideas');
  },
  'dismiss-sug': el => { cur().dismissed.push(el.dataset.k); save(); render(); },
  'restore-dismissed': () => { cur().dismissed = []; save(); render(); },
  'add-outing': () => outingModal(cur()),
  'edit-outing': el => outingModal(cur(), cur().outings.find(o => o.id === el.dataset.id)),
  'del-avoid': el => { const p = cur(); p.avoid = p.avoid.filter(a => a.id !== el.dataset.id); save(); render(); },
  'cycle-on': () => { const p = cur(); p.cycle.on = true; save(); render(); cycleCfgModal(p); },
  'cycle-cfg': () => cycleCfgModal(cur()),
  'cycle-today': () => addStart(cur(), todayISO()),
  'cycle-add': () => modal({ title: 'Registrar inicio del período', body: '<label class="f">Primer día<input type="date" name="d" required></label>', onSubmit: fd => { const p = cur(), d = fd.get('d'); if (!d) return false; if (!p.cycle.starts.includes(d)) p.cycle.starts.push(d); p.cycle.starts.sort(); save(); }, onOpen: f => { f.querySelector('[name=d]').value = todayISO(); } }),
  'cycle-del': el => { const p = cur(); p.cycle.starts = p.cycle.starts.filter(s => s !== el.dataset.d); save(); render(); },
  'cal-prev': () => { const [y, m] = ui.cal.split('-').map(Number); ui.cal = toISO(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  'cal-next': () => { const [y, m] = ui.cal.split('-').map(Number); ui.cal = toISO(new Date(y, m, 1)).slice(0, 7); render(); },
  'cal-day': el => calDayModal(cur(), el.dataset.d),
  'cal-set': el => addStart(cur(), el.dataset.d),
  'cal-unset': el => { const p = cur(); p.cycle.starts = p.cycle.starts.filter(s => s !== el.dataset.d); save(); closeModal(); render(); },
  'export': () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }));
    a.download = `mis-personas-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  'import': () => $('#importFile').click(),
  'wipe': () => { if (confirm('¿Borrar TODOS los datos de este navegador? Exportá un respaldo antes.')) { S = { v: 1, cats: DEFAULT_CATS.map(c => ({ ...c })), people: [] }; save(); closeModal(); location.hash = '#/'; render(); } },
  'demo': () => { demoData(); closeModal(); location.hash = '#/'; render(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && H[el.dataset.a]) { if (el.tagName === 'A') e.preventDefault(); H[el.dataset.a](el, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-f]');
  if (!f) return;
  e.preventDefault();
  if (f.dataset.f === 'avoid-add') {
    const text = new FormData(f).get('text').trim();
    if (text) { cur().avoid.push({ id: uid(), text }); save(); render(); }
  }
});
// tags: Enter / coma confirman, salir del campo también
document.addEventListener('keydown', e => {
  if (e.target.classList?.contains('tin') && (e.key === 'Enter' || e.key === ',')) { e.preventDefault(); commitTag(e.target); }
  if (e.target.classList?.contains('tin') && e.key === 'Backspace' && !e.target.value) e.target.previousElementSibling?.remove();
});
document.addEventListener('focusout', e => { if (e.target.classList?.contains('tin')) commitTag(e.target); });
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  ui.q = e.target.value; ui.tag = ui.tag && ui.q ? '' : ui.tag;
  $('#plist').innerHTML = peopleList(); $('#tagbar').innerHTML = tagbar();
});
$('#photoFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { pendingPhoto = await resizePhoto(f); $('#phprev').innerHTML = photoPrev('?', pendingPhoto); } catch (err) { toast('No se pudo leer la imagen'); }
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const r = JSON.parse(await f.text());
    if (!Array.isArray(r.people)) throw new Error('formato');
    if (!confirm(`Se van a reemplazar los datos actuales por el respaldo (${r.people.length} personas). ¿Seguir?`)) return;
    S = migrate(r); save(); closeModal(); location.hash = '#/'; render(); toast('Respaldo importado');
  } catch (err) { toast('El archivo no es un respaldo válido'); }
});

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- router ---------- */
let lastRoute = null;
function render() {
  const [, kind, id] = location.hash.slice(1).split('/');
  const route = kind === 'p' ? 'p/' + id : 'home';
  const p = kind === 'p' && byId(id);
  if (kind === 'p' && !p) { location.hash = '#/'; return; }
  $('#app').innerHTML = p ? viewPerson(p) : viewHome();
  document.title = p ? `${p.name} · Mis personas` : 'Mis personas';
  if (route !== lastRoute) { window.scrollTo(0, 0); lastRoute = route; ui.noteFilter = ''; ui.noteLimit = 15; ui.cal = null; if (p && Suggest.providers.some(x => x.async)) Suggest.refreshAsync(p); }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
